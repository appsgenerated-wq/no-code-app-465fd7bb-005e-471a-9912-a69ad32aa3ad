name: FoodApp
entities:
  User:
    authenticable: true
    properties:
      - name
      - { name: email, type: email }
      - { name: role, type: choice, options: { values: [chef, diner, admin], default: diner } }
    policies:
      create:
        - access: admin
      read:
        - { access: restricted, allow: User, condition: self }
      update:
        - { access: restricted, allow: User, condition: self }
      delete:
        - access: admin
      signup:
        - access: public

  Recipe:
    properties:
      - { name: title, type: string }
      - { name: description, type: text }
      - { name: ingredients, type: text }
      - { name: instructions, type: text }
      - { name: prepTime, type: number, options: { label: 'Prep Time (minutes)' } }
      - { name: cookTime, type: number, options: { label: 'Cook Time (minutes)' } }
      - { name: photo, type: image }
    belongsTo:
      - { name: author, entity: User }
    policies:
      create:
        - { access: restricted, allow: User }
      read:
        - access: public
      update:
        - { access: restricted, allow: User, condition: self }
      delete:
        - { access: restricted, allow: User, condition: self }


# Health check endpoint for connection testing
endpoints:
  health:
    path: /api/health
    method: GET
    policies: []
    handler: healthCheck